<title>Apply Queue</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&display=swap">
<style>
/* Layout: one column of job rows, Texas roles first; each row is a tap target with a big Apply button */
:root{--bg:#ffffff;--fg:#14181f;--muted:#5d6675;--line:#e3e6eb;--accent:#c8321c;--done:#1f7a4d;--font:"Archivo",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141a;--fg:#e9ecf1;--muted:#9aa3b2;--line:#2a303b;--accent:#ff6a4f;--done:#4cc68a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11141a;--fg:#e9ecf1;--muted:#9aa3b2;--line:#2a303b;--accent:#ff6a4f;--done:#4cc68a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 60px;display:grid;gap:18px}
h1{margin:0;font-size:1.9rem;font-weight:800}
p{margin:0;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar button{font:500 .85rem var(--font);border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.count{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
ul{list-style:none;margin:0;padding:0;display:grid}
li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
li>div{min-width:0}
.t{font-weight:700}
.m{color:var(--muted);font-size:.85rem}
.fit{display:inline-block;min-width:2.6em;text-align:center;font-weight:800;font-size:.75rem;border-radius:4px;padding:1px 5px;margin-right:6px;font-variant-numeric:tabular-nums}.f-hi{background:var(--done);color:var(--bg)}.f-mid{background:var(--line);color:var(--fg)}.f-lo{border:1px solid var(--line);color:var(--muted)}
.tx{color:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.acts{display:flex;gap:6px}
a.apply{background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:8px 14px;border-radius:6px;font-size:.9rem}
button.mark{border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;padding:8px 10px;cursor:pointer;font:500 .85rem var(--font)}
li.done{opacity:.45}
li.done button.mark{color:var(--done);border-color:var(--done)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="wrap">
  <h1>Apply queue</h1>
  <p>Roles with AI in the title, found October 21, 2026, ranked by how well they match your experience. Tap <b>Apply</b>, fill the form, solve the captcha, submit, then tap <b>Done</b>.</p>
  <div class="bar" role="group" aria-label="Filter">
    <button id="f-all" aria-pressed="true" data-f="all">All</button>
    <button id="f-fit" aria-pressed="false" data-f="fit">Strong fits</button><button id="f-tx" aria-pressed="false" data-f="tx">Texas</button>
    <button id="f-todo" aria-pressed="false" data-f="todo">Not applied</button>
    <span class="count" id="count"></span>
  </div>
  <ul id="list"></ul>
</div>
<script>
const JOBS=[{"company": "writer", "title": "Senior AI transformation lead (Central)", "location": "Chicago, IL remote Austin, TX", "pay": 225000, "url": "https://jobs.ashbyhq.com/writer/eaa203c7-1bc5-41ca-952c-50e019effa36/application", "tx": true, "fit": 88}, {"company": "writer", "title": "AI transformation lead (Central)", "location": "Chicago, IL remote Austin, TX", "pay": 198000, "url": "https://jobs.ashbyhq.com/writer/d9ea8ca0-c837-4339-b48e-af69f0acefdd/application", "tx": true, "fit": 88}, {"company": "twilio", "title": "Sr AI Architect - Conversational AI", "location": "Remote - US", "pay": 324480, "url": "https://job-boards.greenhouse.io/twilio/jobs/7926891", "tx": false, "fit": 80}, {"company": "reddit", "title": "Lead Forward Deployed Engineer (AI Enablement)", "location": "Remote - United States", "pay": 272400, "url": "https://job-boards.greenhouse.io/reddit/jobs/8301736", "tx": false, "fit": 80}, {"company": "reddit", "title": "Senior Forward Deployed Engineer (AI Enablement)", "location": "Remote - United States", "pay": 252300, "url": "https://job-boards.greenhouse.io/reddit/jobs/8301784", "tx": false, "fit": 80}, {"company": "gleanwork", "title": "AI Success Manager, East", "location": "Remote - US", "pay": 200000, "url": "https://job-boards.greenhouse.io/gleanwork/jobs/4661878005", "tx": false, "fit": 80}, {"company": "samsara", "title": "AI Architect - GTM Systems", "location": "Remote - US", "pay": 176400, "url": "https://www.samsara.com/company/careers/roles/7578952?gh_jid=7578952", "tx": false, "fit": 80}, {"company": "gleanwork", "title": "AI Success Manager, Central", "location": "Remote - US", "pay": 170000, "url": "https://job-boards.greenhouse.io/gleanwork/jobs/4661884005", "tx": false, "fit": 80}, {"company": "anthropic", "title": "Staff Software Engineer, GTM AI Engineering", "location": "Remote-Friendly (Travel-Required) | San Francisco, CA | Seattle, WA", "pay": 405000, "url": "https://job-boards.greenhouse.io/anthropic/jobs/5390966008", "tx": false, "fit": 68}, {"company": "honeycomb", "title": "Staff AI Operations Lead", "location": "Remote - United States", "pay": 265000, "url": "https://job-boards.greenhouse.io/honeycomb/jobs/5449331008", "tx": false, "fit": 68}, {"company": "samsara", "title": "Senior AI Data & Analytics Engineer II", "location": "Remote - Dallas", "pay": 231000, "url": "https://www.samsara.com/company/careers/roles/8281482?gh_jid=8281482", "tx": true, "fit": 33}, {"company": "databricks", "title": "Sr. Manager \u2013 Data & AI Support Engineering", "location": "Plano, Texas", "pay": 0, "url": "https://databricks.com/company/careers/open-positions/job?gh_jid=7914730002", "tx": true, "fit": 25}, {"company": "samsara", "title": "Senior Manager, AI Quality Engineering", "location": "Remote - US", "pay": 290000, "url": "https://www.samsara.com/company/careers/roles/8139255?gh_jid=8139255", "tx": false, "fit": 17}, {"company": "reddit", "title": "Senior Staff Machine Learning Engineer, GenAI Platform", "location": "Remote - United States", "pay": 409500, "url": "https://job-boards.greenhouse.io/reddit/jobs/7772274", "tx": false, "fit": 13}, {"company": "samsara", "title": "Staff Machine Learning Engineer - Edge AI", "location": "Remote - US", "pay": 319000, "url": "https://www.samsara.com/company/careers/roles/7266357?gh_jid=7266357", "tx": false, "fit": 13}];
let done={};try{done=JSON.parse(localStorage.getItem('applied')||'{}')}catch(e){}
let filter='all';
const save=()=>{try{localStorage.setItem('applied',JSON.stringify(done))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  const rows=JOBS.filter(j=>filter==='all'||(filter==='tx'&&j.tx)||(filter==='fit'&&j.fit>=70)||(filter==='todo'&&!done[j.url]));
  document.getElementById('list').innerHTML=rows.map(j=>`<li class="${done[j.url]?'done':''}"><div><div class="t"><span class="fit ${j.fit>=70?'f-hi':j.fit>=50?'f-mid':'f-lo'}" title="Match score">${j.fit}</span>${esc(j.title.trim())}</div><div class="m">${j.tx?'<span class="tx">Texas</span>':''}${esc(j.company)} · ${esc(j.location.slice(0,60))} · ${j.pay?'up to $'+j.pay.toLocaleString():'pay not listed'}</div></div><div class="acts"><a class="apply" href="${esc(j.url)}" target="_blank" rel="noopener">Apply</a><button class="mark" data-u="${esc(j.url)}">${done[j.url]?'Done ✓':'Done'}</button></div></li>`).join('');
  const n=JOBS.filter(j=>done[j.url]).length;
  document.getElementById('count').textContent=`${n} of ${JOBS.length} applied`;
}
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;document.querySelectorAll('[data-f]').forEach(b=>b.setAttribute('aria-pressed',b===f));render();return}
  const m=e.target.closest('button.mark');if(m){const u=m.dataset.u;done[u]?delete done[u]:done[u]=1;save();render()}
});
render();
</script>
