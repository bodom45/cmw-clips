<style>
/* Layout: one column of job rows, Texas roles first; each row is a tap target with a big Apply button */
:root{--bg:#ffffff;--fg:#14181f;--muted:#5d6675;--line:#e3e6eb;--accent:#c8321c;--done:#1f7a4d;--font:"Archivo",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141a;--fg:#e9ecf1;--muted:#9aa3b2;--line:#2a303b;--accent:#ff6a4f;--done:#4cc68a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11141a;--fg:#e9ecf1;--muted:#9aa3b2;--line:#2a303b;--accent:#ff6a4f;--done:#4cc68a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 60px;display:grid;gap:18px}
h1{margin:0;font-size:1.9rem;font-weight:800}
p{margin:0;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar button{font:500 .85rem var(--font);border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.count{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
ul{list-style:none;margin:0;padding:0;display:grid}
li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
li>div{min-width:0}
.t{font-weight:700}
.m{color:var(--muted);font-size:.85rem}
.tx{color:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.acts{display:flex;gap:6px}
a.apply{background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:8px 14px;border-radius:6px;font-size:.9rem}
button.mark{border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;padding:8px 10px;cursor:pointer;font:500 .85rem var(--font)}
li.done{opacity:.45}
li.done button.mark{color:var(--done);border-color:var(--done)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
