<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMW Beat VJ</title>
<style>
  :root {
    --bg: #000;
    --panel: rgba(14, 14, 18, 0.92);
    --line: rgba(255, 255, 255, 0.12);
    --text: #f2f2f5;
    --muted: #9a9aa6;
    --accent: #ff2e63;
    --accent2: #08d9d6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  body.idle { cursor: none; }

  /* ---------- stage ---------- */
  #stage { position: fixed; inset: 0; overflow: hidden; background: #000; }
  #bg { position: absolute; inset: -10%; width: 120%; height: 120%; filter: blur(28px) saturate(1.4) brightness(0.55); }
  #pulse { position: absolute; inset: 0; will-change: transform, filter; }
  video.deck { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    opacity: 0; will-change: opacity; }
  video.deck.live { opacity: 1; }
  body.fade video.deck { transition: opacity 180ms linear; }
  body.fit-cover video.deck { object-fit: cover; }
  body.fit-cover #bg { display: none; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; mix-blend-mode: screen; }
  #black { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  #logo { position: absolute; right: 3vw; bottom: 3vw; font: 900 4.2vw/1 system-ui, sans-serif; letter-spacing: 0.06em;
    color: #fff; text-shadow: 0 0 2vw rgba(0,0,0,0.7); pointer-events: none; opacity: 0.9; }
  #logo img { height: 9vw; display: block; }
  #logo.hidden { display: none; }

  /* ---------- panel ---------- */
  #panel { position: fixed; top: 12px; left: 12px; width: 340px; max-height: calc(100% - 24px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
    backdrop-filter: blur(10px); transition: opacity 250ms; z-index: 10; }
  body.idle #panel, #panel.hidden { opacity: 0; pointer-events: none; }
  h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h1 small { color: var(--muted); font-weight: 400; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  #panel > .row > label:first-child { width: 78px; color: var(--muted); flex: none; }
  .sep { border-top: 1px solid var(--line); margin: 12px 0; }
  select, input[type=text], input[type=number] { background: #1c1c22; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 7px; font: inherit; min-width: 0; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  button { background: #24242c; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent2); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: #1c1c22; }
  .seg button.on { background: var(--accent); }
  #bpm { font: 700 28px/1 ui-monospace, SFMono-Regular, Menlo, monospace; min-width: 90px; }
  #dots { display: flex; gap: 6px; }
  #dots i { width: 14px; height: 14px; border-radius: 50%; background: #2a2a33; }
  #dots i.on { background: var(--accent2); box-shadow: 0 0 10px var(--accent2); }
  #dots i.on:first-child { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  #status { color: var(--muted); font-size: 12px; }
  #status b { color: var(--text); font-weight: 600; }
  #groups label { display: inline-flex; align-items: center; gap: 4px; background: #1c1c22; border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 8px; cursor: pointer; }
  .keys { color: var(--muted); font-size: 11.5px; line-height: 1.7; }
  kbd { background: #24242c; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font: 11px ui-monospace, monospace; color: var(--text); }
  #empty { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 16px; text-align: center; padding: 16px; }
</style>
</head>
<body class="fade">
<div id="stage">
  <canvas id="bg" width="48" height="27"></canvas>
  <div id="pulse">
    <video class="deck" id="deckA" muted playsinline loop preload="auto"></video>
    <video class="deck" id="deckB" muted playsinline loop preload="auto"></video>
  </div>
  <div id="flash"></div>
  <div id="logo">CMW</div>
  <div id="black"></div>
</div>
<div id="empty">Loading clips…</div>

<div id="panel">
  <h1>CMW Beat VJ <small>press <kbd>H</kbd> to hide</small></h1>

  <div class="row">
    <div id="bpm">---</div>
    <div id="dots"><i></i><i></i><i></i><i></i></div>
  </div>
  <div id="status">Starting…</div>

  <div class="sep"></div>

  <div class="row">
    <label>Sync</label>
    <div class="seg" id="srcSeg">
      <button data-v="link">Link</button><button data-v="audio">Audio</button><button data-v="tap">Tap</button>
    </div>
  </div>
  <div class="row" id="audioRow" hidden>
    <label>Input</label>
    <select id="audioDev" style="flex:1"><option value="">Default input</option></select>
  </div>
  <div class="row" id="sensRow" hidden>
    <label>Sensitivity</label>
    <input type="range" id="sens" min="0.5" max="3" step="0.1" value="1.5">
  </div>
  <div class="row">
    <label>Latency</label>
    <input type="range" id="latency" min="-100" max="600" step="10" value="0">
    <span id="latencyVal" style="width:52px;text-align:right">0 ms</span>
  </div>

  <div class="sep"></div>

  <div class="row">
    <label>Cut every</label>
    <div class="seg" id="cutSeg">
      <button data-v="1">1</button><button data-v="2">2</button><button data-v="4">4</button><button data-v="8">8</button><button data-v="16">16</button>
    </div>
    <span style="color:var(--muted)">beats</span>
  </div>
  <div class="row">
    <label>Transition</label>
    <div class="seg" id="transSeg"><button data-v="cut">Hard cut</button><button data-v="fade">Quick fade</button></div>
  </div>
  <div class="row">
    <label>Framing</label>
    <div class="seg" id="fitSeg"><button data-v="blur">Fit + blur</button><button data-v="cover">Fill / crop</button></div>
  </div>
  <div class="row">
    <label>FX</label>
    <button id="fxFlash">Flash</button>
    <button id="fxPulse">Pulse</button>
    <button id="fxColor">Color hit</button>
    <button id="fxStutter">Stutter</button>
  </div>
  <div class="row">
    <label>Clips</label>
    <div id="groups" class="row" style="margin:0;flex:1"></div>
  </div>
  <div class="row">
    <label></label>
    <button id="pickFolder">Load folder…</button>
    <input type="file" id="folderInput" webkitdirectory multiple hidden>
  </div>

  <div class="sep"></div>

  <div class="row">
    <label>Logo</label>
    <input type="text" id="logoText" value="CMW" style="flex:1">
    <button id="logoToggle">Show</button>
  </div>
  <div class="row">
    <label></label>
    <button id="logoImgBtn">Use image…</button>
    <input type="file" id="logoImg" accept="image/*" hidden>
    <button id="fsBtn">Fullscreen</button>
  </div>

  <div class="sep"></div>
  <div class="keys">
    <kbd>Space</kbd> tap tempo · <kbd>Enter</kbd> set downbeat (beat 1) · <kbd>N</kbd> next clip<br>
    <kbd>S</kbd> hold strobe · <kbd>B</kbd> blackout · <kbd>I</kbd> invert · <kbd>T</kbd> stutter<br>
    <kbd>1</kbd>–<kbd>5</kbd> cut every 1/2/4/8/16 · <kbd>F</kbd> fullscreen · <kbd>H</kbd> hide panel
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);

  // ---------- settings (remembered per browser) ----------
  const defaults = { src: "link", cut: 4, trans: "cut", fit: "blur", latency: 0, sens: 1.5,
    flash: true, pulse: true, color: false, stutter: false, logo: true, logoText: "CMW", groups: null, audioDev: "" };
  let S = { ...defaults };
  try { Object.assign(S, JSON.parse(localStorage.getItem("cmwvj") || "{}")); } catch {}
  const save = () => { try { localStorage.setItem("cmwvj", JSON.stringify(S)); } catch {} };

  // ---------- beat clock ----------
  // beat(t) = anchorBeat + (t - anchorTime) * bpm / 60000, t in performance.now() ms
  const clock = { bpm: 120, anchorBeat: 0, anchorTime: performance.now(), barOffset: 0, valid: false };
  const beatAt = (t) => clock.anchorBeat + (t - clock.anchorTime) * clock.bpm / 60000;
  function setClock(bpm, beat, t) {
    clock.bpm = bpm; clock.anchorBeat = beat; clock.anchorTime = t; clock.valid = true;
  }
  function setTempoKeepPhase(bpm) {
    const now = performance.now();
    setClock(bpm, beatAt(now), now);
  }

  // ---------- Link (via server.js + Carabiner) ----------
  let linkState = { connected: false, peers: 0 };
  let serverOk = false;
  function startLink() {
    if (!window.EventSource || location.protocol === "file:") return;
    const es = new EventSource("/link");
    es.onmessage = (e) => {
      const m = JSON.parse(e.data);
      linkState = m;
      if (S.src !== "link" || !m.connected || !m.bpm) return;
      // Server stamped the sample with Date.now(); convert to our clock.
      const t = performance.now() - (Date.now() - m.t);
      const predicted = beatAt(t);
      const err = m.beat - predicted;
      if (!clock.valid || Math.abs(err) > 0.1 || Math.abs(m.bpm - clock.bpm) > 0.05) setClock(m.bpm, m.beat, t);
      else setClock(m.bpm, predicted + err * 0.3, t); // smooth out network jitter
    };
  }

  // ---------- Tap tempo ----------
  let taps = [];
  function tap() {
    const now = performance.now();
    if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
    taps.push(now);
    if (taps.length > 8) taps.shift();
    if (S.src !== "tap") setSource("tap");
    if (taps.length >= 2) {
      const bpm = 60000 * (taps.length - 1) / (taps[taps.length - 1] - taps[0]);
      setClock(bpm, Math.round(beatAt(now)), now);
    } else if (!clock.valid) {
      setClock(clock.bpm, 0, now);
    } else {
      setClock(clock.bpm, Math.round(beatAt(now)), now);
    }
  }

  // ---------- Audio beat detection ----------
  // Low-pass the input (kick drum range), watch for energy jumps well above
  // the recent average, then phase-lock the beat clock to those hits.
  let audio = null, audioErr = "";
  async function startAudio() {
    stopAudio();
    audioErr = "";
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: {
        deviceId: S.audioDev ? { exact: S.audioDev } : undefined,
        echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const srcNode = ctx.createMediaStreamSource(stream);
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 150;
      const an = ctx.createAnalyser(); an.fftSize = 1024;
      srcNode.connect(lp); lp.connect(an);
      audio = { stream, ctx, an, buf: new Float32Array(an.fftSize), prev: 0, hist: [], onsets: [], lastOnset: 0, hits: 0 };
      listAudioDevices();
    } catch (err) {
      audio = null;
      audioErr = err.message || String(err);
    }
  }
  function stopAudio() {
    if (!audio) return;
    audio.stream.getTracks().forEach((t) => t.stop());
    audio.ctx.close();
    audio = null;
  }
  function tickAudio(now) {
    if (!audio) return;
    const a = audio;
    a.an.getFloatTimeDomainData(a.buf);
    let e = 0;
    for (let i = 0; i < a.buf.length; i++) e += a.buf[i] * a.buf[i];
    e = Math.sqrt(e / a.buf.length);
    const flux = Math.max(0, e - a.prev);
    a.prev = e;
    a.hist.push(flux);
    if (a.hist.length > 60) a.hist.shift();
    const mean = a.hist.reduce((x, y) => x + y, 0) / a.hist.length;
    const sd = Math.sqrt(a.hist.reduce((x, y) => x + (y - mean) ** 2, 0) / a.hist.length);
    const thr = mean + (3.5 - S.sens) * sd + 0.002;
    if (flux > thr && now - a.lastOnset > 280) onOnset(now);
  }
  function onOnset(now) {
    const a = audio;
    a.lastOnset = now;
    a.hits++;
    a.onsets.push(now);
    if (a.onsets.length > 24) a.onsets.shift();
    // Tempo: median gap between hits, folded into 80–170 BPM.
    if (a.onsets.length >= 5) {
      const gaps = [];
      for (let i = 1; i < a.onsets.length; i++) {
        let g = a.onsets[i] - a.onsets[i - 1];
        if (g > 1500) continue;
        while (60000 / g < 80) g /= 2;
        while (60000 / g > 170) g *= 2;
        gaps.push(g);
      }
      if (gaps.length >= 4) {
        gaps.sort((x, y) => x - y);
        const bpm = 60000 / gaps[gaps.length >> 1];
        if (!clock.valid) setClock(bpm, 0, now);
        else if (Math.abs(bpm - clock.bpm) / clock.bpm > 0.02) setTempoKeepPhase(clock.bpm + (bpm - clock.bpm) * 0.5);
      }
    }
    if (!clock.valid) return;
    // Phase: nudge the clock toward the nearest whole beat.
    const b = beatAt(now);
    const err = b - Math.round(b);
    if (Math.abs(err) < 0.3) setClock(clock.bpm, b - err * 0.35, now);
  }
  async function listAudioDevices() {
    try {
      const devs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "audioinput");
      const sel = $("audioDev");
      sel.innerHTML = '<option value="">Default input</option>' +
        devs.map((d) => `<option value="${d.deviceId}">${d.label || "Input " + d.deviceId.slice(0, 6)}</option>`).join("");
      sel.value = S.audioDev;
    } catch {}
  }

  // ---------- clips ----------
  let clips = [];          // { name, url, group }
  let groups = [];
  const groupOf = (n) => (n.match(/^(.*?)[_-]?\d+T?\.\w+$/) || [, "Other"])[1] || "Other";
  function setClips(list) {
    clips = list.map((c) => ({ ...c, group: groupOf(c.name) }));
    groups = [...new Set(clips.map((c) => c.group))];
    if (!S.groups) S.groups = groups.slice();
    renderGroups();
    $("empty").hidden = clips.length > 0;
    if (!clips.length) $("empty").textContent = "No clips found. Click “Load folder…” in the panel.";
    else primeDecks();
  }
  function pool() {
    const p = clips.filter((c) => S.groups.includes(c.group));
    return p.length ? p : clips;
  }
  let lastPicks = [];
  function pickClip() {
    const p = pool();
    let c, tries = 0;
    do { c = p[Math.floor(Math.random() * p.length)]; } while (lastPicks.includes(c.url) && ++tries < 10);
    lastPicks.push(c.url);
    if (lastPicks.length > Math.min(8, p.length - 1)) lastPicks.shift();
    return c;
  }
  async function loadClips() {
    try {
      const r = await fetch("clips.json");
      if (!r.ok) throw 0;
      serverOk = true;
      setClips((await r.json()).map((n) => ({ name: n, url: "clips/" + encodeURIComponent(n) })));
    } catch {
      setClips([]);
    }
  }
  $("pickFolder").onclick = () => $("folderInput").click();
  $("folderInput").onchange = (e) => {
    const files = [...e.target.files].filter((f) => /\.(mp4|mov|webm|m4v)$/i.test(f.name));
    S.groups = null;
    setClips(files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
      .map((f) => ({ name: f.name, url: URL.createObjectURL(f) })));
  };

  // ---------- decks ----------
  // Two <video>s: one live, one preloading the next clip at a random spot.
  const decks = [$("deckA"), $("deckB")];
  let live = 0;
  const cue = [0, 0];
  function loadDeck(i) {
    const v = decks[i];
    const c = pickClip();
    v.dataset.ready = "";
    v.src = c.url;
    v.onloadedmetadata = () => {
      const d = v.duration || 0;
      cue[i] = d > 6 ? Math.random() * (d - 4) : 0;
      v.currentTime = cue[i];
    };
    v.onseeked = () => { v.dataset.ready = "1"; v.onseeked = null; };
    v.onerror = () => setTimeout(() => loadDeck(i), 200);
  }
  function primeDecks() {
    loadDeck(0); loadDeck(1);
    decks[0].classList.add("live"); decks[1].classList.remove("live");
    live = 0;
    decks[0].play().catch(() => {});
  }
  function cut() {
    const next = 1 - live;
    const v = decks[next];
    if (!v.dataset.ready) return; // not buffered yet; try again next cut
    v.play().catch(() => {});
    v.classList.add("live");
    decks[live].classList.remove("live");
    const old = live;
    live = next;
    setTimeout(() => { decks[old].pause(); loadDeck(old); }, S.trans === "fade" ? 250 : 30);
  }

  // ---------- FX ----------
  const flashEl = $("flash"), pulseEl = $("pulse"), blackEl = $("black");
  let flashLevel = 0, colorLevel = 0, hue = 0, strobe = false, blackout = false, invert = false;
  function onBeat(n) {
    const inBar = ((n % 4) + 4) % 4;
    [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i === inBar));
    if (S.flash) flashLevel = inBar === 0 ? 0.55 : 0.25;
    if (S.color) { colorLevel = 1; if (inBar === 0) hue = (hue + 60 + Math.random() * 120) % 360; }
    if (clips.length && ((n % S.cut) + S.cut) % S.cut === 0) cut();
  }
  function onHalfBeat() {
    if (S.stutter) {
      const v = decks[live];
      if (v.readyState >= 2) v.currentTime = cue[live];
    }
  }

  // ---------- render loop ----------
  const bgCtx = $("bg").getContext("2d");
  let lastBeat = null, lastHalf = null, frame = 0;
  function loop() {
    const now = performance.now();
    tickAudio(now);
    const b = beatAt(now + S.latency) - clock.barOffset;
    const whole = Math.floor(b), half = Math.floor(b * 2), frac = b - whole;

    if (clock.valid) {
      if (lastBeat !== null && whole !== lastBeat) onBeat(whole);
      if (lastHalf !== null && half !== lastHalf) onHalfBeat();
      lastBeat = whole; lastHalf = half;
    }

    const scale = S.pulse && clock.valid ? 1 + 0.045 * Math.exp(-frac * 7) : 1;
    let filter = "";
    if (colorLevel > 0.01) filter += `hue-rotate(${hue}deg) saturate(${1 + colorLevel}) contrast(${1 + colorLevel * 0.4}) `;
    if (invert) filter += "invert(1) ";
    pulseEl.style.transform = `scale(${scale})`;
    pulseEl.style.filter = filter;
    colorLevel *= 0.9;

    const strobeOn = strobe && Math.floor(now / 50) % 2 === 0;
    flashEl.style.opacity = strobeOn ? 1 : flashLevel;
    flashLevel *= 0.82;
    blackEl.style.opacity = blackout ? 1 : 0;

    if (S.fit === "blur" && (frame++ & 1) === 0) {
      const v = decks[live];
      if (v.readyState >= 2) bgCtx.drawImage(v, 0, 0, 48, 27);
    }

    if ((frame & 15) === 0) renderStatus();
    requestAnimationFrame(loop);
  }

  // ---------- UI ----------
  function status(html) { $("status").innerHTML = html; }
  function renderStatus() {
    $("bpm").textContent = clock.valid ? clock.bpm.toFixed(1) : "---";
    if (S.src === "link") {
      if (!serverOk) status("Link needs <b>node vj/server.js</b> running. Use Audio or Tap instead.");
      else if (!linkState.connected) status("Waiting for <b>Carabiner</b>… (start it, then turn on Link in Serato)");
      else if (!linkState.peers) status("Carabiner up, <b>no Link peers</b>. Turn on Ableton Link in Serato.");
      else status(`Locked to Link · <b>${linkState.peers}</b> peer${linkState.peers > 1 ? "s" : ""}`);
    } else if (S.src === "audio") {
      status(audio ? `Listening · <b>${audio.hits}</b> hits detected`
        : audioErr ? `Audio input blocked: <b>${audioErr}</b>` : "Starting audio input…");
    } else {
      status(taps.length > 1 ? `Tap tempo · <b>${taps.length}</b> taps` : "Tap <b>Space</b> on the beat");
    }
  }
  function seg(id, key, onChange) {
    const el = $(id);
    const paint = () => [...el.children].forEach((b) => b.classList.toggle("on", String(S[key]) === b.dataset.v));
    el.onclick = (e) => {
      const b = e.target.closest("button"); if (!b) return;
      S[key] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v;
      paint(); save(); onChange && onChange();
    };
    paint();
    return paint;
  }
  function toggle(id, key, onChange) {
    const el = $(id);
    const paint = () => el.classList.toggle("on", !!S[key]);
    el.onclick = () => { S[key] = !S[key]; paint(); save(); onChange && onChange(); };
    paint();
    return paint;
  }
  const paintSrc = seg("srcSeg", "src", applySource);
  function setSource(v) { S.src = v; paintSrc(); save(); applySource(); }
  function applySource() {
    $("audioRow").hidden = $("sensRow").hidden = S.src !== "audio";
    if (S.src === "audio") startAudio(); else stopAudio();
  }
  const paintCut = seg("cutSeg", "cut");
  seg("transSeg", "trans", () => document.body.classList.toggle("fade", S.trans === "fade"));
  seg("fitSeg", "fit", () => document.body.classList.toggle("fit-cover", S.fit === "cover"));
  toggle("fxFlash", "flash");
  toggle("fxPulse", "pulse");
  toggle("fxColor", "color");
  const paintStutter = toggle("fxStutter", "stutter");
  toggle("logoToggle", "logo", applyLogo);
  document.body.classList.toggle("fade", S.trans === "fade");
  document.body.classList.toggle("fit-cover", S.fit === "cover");

  $("latency").value = S.latency;
  $("latencyVal").textContent = S.latency + " ms";
  $("latency").oninput = (e) => { S.latency = +e.target.value; $("latencyVal").textContent = S.latency + " ms"; save(); };
  $("sens").value = S.sens;
  $("sens").oninput = (e) => { S.sens = +e.target.value; save(); };
  $("audioDev").onchange = (e) => { S.audioDev = e.target.value; save(); startAudio(); };

  let logoImgUrl = null;
  function applyLogo() {
    const el = $("logo");
    el.classList.toggle("hidden", !S.logo);
    if (logoImgUrl) { el.innerHTML = ""; const img = new Image(); img.src = logoImgUrl; el.appendChild(img); }
    else el.textContent = S.logoText;
  }
  $("logoText").value = S.logoText;
  $("logoText").oninput = (e) => { S.logoText = e.target.value; logoImgUrl = null; save(); applyLogo(); };
  $("logoImgBtn").onclick = () => $("logoImg").click();
  $("logoImg").onchange = (e) => { const f = e.target.files[0]; if (f) { logoImgUrl = URL.createObjectURL(f); applyLogo(); } };
  applyLogo();

  function renderGroups() {
    $("groups").innerHTML = groups.map((g) =>
      `<label><input type="checkbox" value="${g}" ${S.groups.includes(g) ? "checked" : ""}>${g}
       <span style="color:var(--muted)">${clips.filter((c) => c.group === g).length}</span></label>`).join("");
    $("groups").onchange = () => {
      S.groups = [...$("groups").querySelectorAll("input:checked")].map((i) => i.value);
      save();
    };
  }

  function fullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  }
  $("fsBtn").onclick = fullscreen;

  addEventListener("keydown", (e) => {
    if (e.target.matches("input[type=text], select")) return;
    const k = e.key.toLowerCase();
    if (k === " ") { e.preventDefault(); tap(); }
    else if (k === "enter") {
      // Make "right now" beat 1 of the bar.
      if (!clock.valid) setClock(clock.bpm, 0, performance.now());
      const b = beatAt(performance.now() + S.latency);
      clock.barOffset = ((Math.round(b) % 4) + 4) % 4;
      lastBeat = null;
    }
    else if (k === "n") cut();
    else if (k === "s") strobe = true;
    else if (k === "b") blackout = !blackout;
    else if (k === "i") invert = !invert;
    else if (k === "t") { S.stutter = !S.stutter; paintStutter(); save(); }
    else if (k === "f") fullscreen();
    else if (k === "h") $("panel").classList.toggle("hidden");
    else if ("12345".includes(k) && k) { S.cut = [1, 2, 4, 8, 16][+k - 1]; paintCut(); save(); }
  });
  addEventListener("keyup", (e) => { if (e.key.toLowerCase() === "s") strobe = false; });

  // Hide cursor + panel after 3 s of no mouse movement.
  let idleTimer;
  addEventListener("mousemove", () => {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000);
  });

  // ---------- go ----------
  startLink();
  loadClips();
  applySource();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
