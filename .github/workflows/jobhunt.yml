name: jobhunt
on:
  schedule:
    - cron: '47 11 * * *'   # ~6:47am Central, daily
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: jobhunt
jobs:
  find:
    runs-on: ubuntu-latest
    env:
      MIN_SALARY: '80000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python jobhunt/find_jobs.py
      - name: save queue
        run: |
          git add jobhunt/seen.json jobhunt/QUEUE.md
          if ! git diff --cached --quiet; then
            git config user.name "jobhunt-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "jobhunt: daily queue [skip ci]" && git pull --rebase && git push
          fi
